name: Build Windows EXE

# Builds WindPCEA as a standalone Windows .exe (no Python needed to run).
# Trigger manually (Actions -> Build Windows EXE -> Run workflow) or on push.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app.py', 'windpcea/**', 'requirements.txt', '.github/workflows/build-exe.yml' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name WindPCEA `
            --add-data "sample_data;sample_data" `
            --hidden-import matplotlib.backends.backend_agg `
            app.py

      - name: Smoke test (run EXE headlessly, check it serves)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WindPCEA.exe" -PassThru
          Start-Sleep -Seconds 25
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 20
            Write-Host "EXE smoke test OK: HTTP $($r.StatusCode)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindPCEA-Windows
          path: dist/WindPCEA.exe
          retention-days: 90
