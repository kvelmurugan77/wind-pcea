name: Build Windows EXE

# Builds WindPCEA as a standalone Windows .exe (no Python needed to run).
# On every push (or manual trigger):
#   1. runs the full test suite on the build machine (tests must pass)
#   2. builds the EXE with PyInstaller
#   3. smoke-tests the EXE (serves the web app)
#   4. publishes it as a GitHub release  -> the canonical link below always
#      serves the newest version:
#      https://github.com/kvelmurugan77/wind-pcea/releases/latest/download/WindPCEA.exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app.py', 'windpcea/**', 'requirements.txt', '.github/workflows/build-exe.yml' ]

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  test:
    name: Tests (must pass before building)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        shell: pwsh
        run: |
          python tests/test_robustness.py
          python tests/test_oem_scada.py
          python tests/test_blockwise.py
          python tests/test_wake_model.py
          python tests/test_ltproduction.py
          python -m pytest tests/test_ltproduction.py -q

  build:
    name: Build EXE and publish release
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version from windpcea/__init__.py
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path windpcea\__init__.py -Pattern '(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          Write-Host "Version detected: $v"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name WindPCEA `
            --add-data "sample_data;sample_data" `
            --hidden-import matplotlib.backends.backend_agg `
            app.py

      - name: Smoke test (run EXE headlessly, check it serves)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WindPCEA.exe" -PassThru
          Start-Sleep -Seconds 25
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 20
            Write-Host "EXE smoke test OK: HTTP $($r.StatusCode)"
            if ($r.StatusCode -ne 200) { throw "EXE did not serve HTTP 200" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindPCEA-Windows
          path: dist/WindPCEA.exe
          retention-days: 90

      - name: Delete previous release with same tag (keep the canonical link fresh)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:VERSION = "v${{ steps.version.outputs.VERSION }}"
          gh release delete $env:VERSION --yes --cleanup-tag 2>$null
          # 'gh release delete' returns non-zero when the release does not
          # exist yet (first build of a version) - that is expected, so do
          # not fail the job:
          $global:LASTEXITCODE = 0

      - name: Publish release with EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:VERSION = "v${{ steps.version.outputs.VERSION }}"
          gh release create $env:VERSION dist/WindPCEA.exe `
            --title "WindPCEA $env:VERSION" `
            --notes "Auto-built from main@$env:GITHUB_SHA. Full test suite passed on the build machine before building. Download: https://github.com/kvelmurugan77/wind-pcea/releases/latest/download/WindPCEA.exe"
